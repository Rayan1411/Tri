databases:
  - name: stocks-db
    databaseName: stocks
    user: stocks
    plan: free

services:
  # ---------------------------------------------------------------- API (FastAPI)
  - type: web
    name: stocks-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: stocks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_USERNAME
        value: rayan
      - key: APP_PASSWORD
        sync: false
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_FEED
        value: iex
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash

  # ---------------------------------------------------------------- Web (Next.js)
  - type: web
    name: stocks-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: stocks-api
          property: hostport
